<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HRMS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- LOGIN -->
  <div id="login-view">
    <form class="login-card" onsubmit="login(event)">
      <h1>HRMS</h1>
      <p class="muted">Sign in to continue</p>
      <label>Email <input id="email" type="email" required /></label>
      <label>Password <input id="password" type="password" required /></label>
      <p id="login-error" class="error"></p>
      <button class="primary" type="submit">Sign in</button>
      <div class="demo">
        <strong>Demo logins</strong><br />
        admin@demo.com / admin123<br />
        hr@demo.com / hr123<br />
        emp@demo.com / emp123
      </div>
    </form>
  </div>

  <!-- APP -->
  <div id="app-view" class="hidden">
    <aside class="sidebar">
      <div class="brand">HRMS</div>
      <nav id="nav"></nav>
      <button class="link" onclick="logout()">Log out</button>
    </aside>
    <main>
      <header class="topbar">
        <h2 id="page-title"></h2>
        <span id="user-info" class="muted"></span>
      </header>
      <section id="content"></section>
    </main>
  </div>

  <!-- MODAL -->
  <div id="modal" class="hidden">
    <form id="modal-form" class="modal-card">
      <h3 id="modal-title"></h3>
      <div id="modal-form-body"></div>
      <div class="actions">
        <button type="button" onclick="closeModal()">Cancel</button>
        <button class="primary" type="submit">Save</button>
      </div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
